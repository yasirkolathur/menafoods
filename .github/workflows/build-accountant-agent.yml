name: Build MENAFoods Accountant APK

on:
  pull_request:
    branches:
      - main
    paths:
      - 'accountant-agent/**'
      - '.github/workflows/build-accountant-agent.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK and release bundle
        working-directory: accountant-agent
        run: gradle --no-daemon --build-cache assembleDebug bundleRelease
      - name: Verify Android artifacts
        run: |
          test -s accountant-agent/app/build/outputs/apk/debug/app-debug.apk
          test -s accountant-agent/app/build/outputs/bundle/release/app-release.aab
          ls -lh accountant-agent/app/build/outputs/apk/debug/app-debug.apk
          ls -lh accountant-agent/app/build/outputs/bundle/release/app-release.aab
          sha256sum accountant-agent/app/build/outputs/apk/debug/app-debug.apk
          sha256sum accountant-agent/app/build/outputs/bundle/release/app-release.aab
      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: MENAFoods-Accountant-Agent-APK
          path: accountant-agent/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Upload Play bundle
        uses: actions/upload-artifact@v4
        with:
          name: MENAFoods-Accountant-Agent-Play-AAB
          path: accountant-agent/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
