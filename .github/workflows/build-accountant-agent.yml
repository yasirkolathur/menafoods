name: Build MENAFoods Accountant APK

on:
  push:
    branches:
      - accountant-agent-apk-build
    paths:
      - 'accountant-agent/**'
      - '.github/workflows/build-accountant-agent.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        working-directory: accountant-agent
        run: gradle --no-daemon clean assembleDebug
      - name: Verify APK
        run: |
          test -s accountant-agent/app/build/outputs/apk/debug/app-debug.apk
          ls -lh accountant-agent/app/build/outputs/apk/debug/app-debug.apk
          sha256sum accountant-agent/app/build/outputs/apk/debug/app-debug.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MENAFoods-Accountant-Agent-APK
          path: accountant-agent/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
