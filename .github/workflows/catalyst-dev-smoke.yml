name: Catalyst Development Smoke (read only)
on:
  workflow_dispatch:
  schedule:
    - cron: '23 4 * * *'
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check existing Catalyst Development APIs
        run: node --test test/catalyst-dev-smoke.test.js
