name: Build MENAFoods Accountant APK
on:
  push:
    branches: [accountant-agent-apk-build]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: accountant-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle assembleDebug --stacktrace
      - name: Collect APK
        run: cp app/build/outputs/apk/debug/app-debug.apk ../MENAFoods-Accountant-Agent-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: MENAFoods-Accountant-Agent-APK
          path: MENAFoods-Accountant-Agent-debug.apk
          if-no-files-found: error
