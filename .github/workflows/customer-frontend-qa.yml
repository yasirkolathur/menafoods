name: Department 1 - Customer Frontend QA

on:
  pull_request:
    paths:
      - 'tools/verify-hosted-customer.mjs'
      - 'tools/verify-hosted-customer.test.mjs'
      - '.github/workflows/customer-frontend-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  read-only-static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check frontend verification script syntax
        run: node --check tools/verify-hosted-customer.mjs
      - name: Run offline deterministic client verification tests
        run: node --test tools/verify-hosted-customer.test.mjs
